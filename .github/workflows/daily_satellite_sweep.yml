name: Daily Satellite Tank Sweep

on:
  schedule:
    # Runs at 02:00 UTC (07:30 IST) every morning
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  satellite-sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Pipeline Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r pipeline/requirements.txt

      - name: Run Daily Tank Bloom Risk Sweep
        env:
          GEE_SERVICE_ACCOUNT_JSON: ${{ secrets.GEE_SERVICE_ACCOUNT_JSON }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ALERT_SMS_API_KEY: ${{ secrets.ALERT_SMS_API_KEY }}
        run: |
          python pipeline/jobs/daily_sweep.py --state Karnataka --lookback-days 14
