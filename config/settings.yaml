system:
  project_name: "Karnataka Village Fish Tank Early Warning System"
  version: "1.0.0-wireframe"
  timezone: "Asia/Kolkata"

satellite:
  constellation: "Sentinel-2 MSI Level-2A"
  bands:
    red: "B4"
    red_edge: "B5"
    nir: "B8"
    scene_classification: "SCL"
  max_cloud_cover_percent: 25.0
  revisit_window_days: 5

thresholds:
  ndci:
    normal_max: 0.20        # Safe baseline
    watch_min: 0.21         # Early warning (Day 1-4)
    warning_min: 0.35       # Moderate bloom (Day 5-8)
    critical_min: 0.50      # Heavy bloom / die-off risk (Day 9-14)
  dissolved_oxygen:
    optimal_min_mg_l: 6.5
    stress_threshold_mg_l: 5.0
    lethal_threshold_mg_l: 4.0

alert_routing:
  notification_channels:
    - "SMS"
    - "WHATSAPP"
    - "PANCHAYAT_PORTAL"
  languages:
    primary: "kn-IN"        # Kannada
    secondary: "en-IN"      # English
