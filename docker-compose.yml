version: '3.8'

services:
  db:
    image: postgis/postgis:15-3.3
    container_name: algal_watch_postgis
    environment:
      POSTGRES_DB: algal_watch_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: algal_watch_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algal_watch_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/algal_watch_db
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis

  pipeline-cron:
    build:
      context: ./pipeline
      dockerfile: Dockerfile
    container_name: algal_watch_pipeline_cron
    environment:
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/algal_watch_db
    depends_on:
      - db

  dashboard:
    image: nginx:alpine
    container_name: algal_watch_dashboard
    ports:
      - "3000:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html

volumes:
  pgdata:
